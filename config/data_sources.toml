# Dataset and lexicon manifest for scripts/fetch_data.py (brief §3).
#
# Seeded from docs/research/notes/R1-lexicons-datasets.md (final JSON block). Nothing here is
# verified yet: every source has verified = false until a verifier confirms URL, licence and
# class. Licence text is "as stated" by R1; licence_class is R1's (strictest) reading.
#
# Schema (unknown keys are errors):
#   [[source]]
#     id            [a-z0-9_]+ ; files land in data/raw/<id>/
#     name, licence (as stated), homepage, instructions : strings
#     licence_class commercial-OK | research-only | needs-licence | unclear | unverified
#     access        auto | manual | hf_dataset
#     verified      bool
#     version, licence_url, notes : optional strings
#   auto       -> one or more [[source.files]] with url, dest (relative), extract (bool;
#                 .zip / .tar.gz / .tgz only)
#   hf_dataset -> repo_id = "owner/name", revision (prefer a 40-char commit sha)
#   manual     -> expected = [relative paths or glob patterns under data/raw/<id>/]
#
# Checksums live in config/data_sources.lock.json and are written only by --record-checksums.

# ------------------------------------------------------------------------------- English VAD

[[source]]
id = "anew"
name = "ANEW (Affective Norms for English Words)"
version = "1999 (1,034 words)"
licence = "signed user agreement from UF CSEA; terms not retrieved"
licence_class = "needs-licence"
licence_url = "https://csea.phhp.ufl.edu/media/anewmessage.html"
access = "manual"
homepage = "https://csea.phhp.ufl.edu/media/anewmessage.html"
verified = false
instructions = """Submit the ANEW Researcher Information Form on the CSEA page, sign the User \
Agreement and ask in writing whether commercial use is allowed. Low priority: Warriner and NRC \
VAD cover the same ground. Save the ratings file(s) as CSV into data/raw/anew/."""
expected = ["*.csv"]
notes = "single-source (search summary); host not reachable from the container."

